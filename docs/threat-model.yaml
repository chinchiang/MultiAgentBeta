# MultiAgentBeta（Vibe Audit 0.2.1）的 G0 威脅模型 —— 草稿，尚未經人工簽核
#
# 格式：chinchiang/MultiAgentDelta 的 schemas/threat-model.schema.json。VibeSec G0
#   （MultiAgentDelta 的 scripts/g0_threat_model.py --target <本 repo>）預設讀取本檔。
# 來源：AI 起草（Claude Code，2026-10-06），依據 README.md、docs/ARCHITECTURE.md、docs/LINUX_SETUP.md 與
#   backend/vibe_audit/ 的程式碼（commit f9d9cf1，再依本分支的修正更新）；括號內的 file:line 皆相對 backend/vibe_audit/。
# 範圍：Linux／WSL2 的 live 部署（PostgreSQL + Docker workers + supervisor）。Windows demo、process_test 與
#   SQLite 屬合成／測試路徑（ARCHITECTURE.md「Isolation and recovery」），不在範圍內。
#
# 已由人類決定：
#   - 2026-10-06 @chinchiang：c-test-designer 的致命三要素以 trifecta_leg_cut: external_comms 切腳，理由與接受的殘留見 decisions。
#   - 2026-10-06 @chinchiang：risk_tier 維持 L3（高於決策樹推導的 L2），理由見 risk_tier_rationale。
#   - 2026-10-06 @chinchiang：保留兩項行為變更（模型金鑰的 origin 綁定、model_selectable 身分），見 decisions。
#   - 2026-10-06 @chinchiang：t-redaction-gap、t-container-escape、t-supply-chain 接受殘留，改為 accepted，見 decisions。
#   - 2026-10-06 @chinchiang：G4 第 5–11 輪審查後，接受 t-container-escape 量化後的殘留（每次掃描數 KB）與黑箱容器的時間通道
#     殘留（t-target-response-parsing 殘留 (2)），並確認保留測試身分憑證以 VIBEAUDIT_TARGET_CREDENTIAL_ORIGINS 綁定 origin 的行為變更。
#
# 待辦：docs/01 要求 AppSec 與 Red Team 各一人簽核本模型（分歧保留少數意見）。
#
# 修訂：同日依本分支的程式修正，把 t-indirect-injection、t-model-identity、t-probe-key-exfil、t-credential-crossuse、
#   t-target-internal、t-sarif-injection 改為 mitigated（各條的「殘留」仍待人工確認）；file:line 已對應修正後的程式碼。

system:
  name: multiagentbeta
  description: >-
    Vibe Audit 0.2.1：本機單一使用者的 Multi-Agent 資安測試工具。三模型白箱審查 → 威脅建模 → 案例與 oracle →
    隔離黑箱執行 → 證據裁決；AI Commander 派工，程式 harness 強制範圍、階段、權限、預算與證據。
  exposure: internal                          # 控制台只監聽 127.0.0.1（__main__.py:28）；單一使用者、無租戶（store.py:71：runs 沒有 owner 欄位）；README 明示不得公開到網際網路
  data_sensitivity: sensitive_pii_or_secrets  # 受測原始碼與保留機密檔的 raw staging、目標憑證、模型 API 金鑰、資料庫 URL
  methodologies: [STRIDE, MAESTRO]

assets:
  - id: a-target-source
    name: 受測原始碼與 raw staging 副本（保留受測 repo 的機密檔供掃描器使用）
    sensitivity: secret
    store: "<data_dir>/scanner-inputs/<id>：父目錄 0700、檔案 0444（staging.py:42-51）；whitebox 結束、每次 attempt 結束與啟動時刪除"
  - id: a-snapshot
    name: 給模型的去識別化快照（啟發式遮罩，snapshot.py:53、209）
    sensitivity: confidential
    store: 送往 model profile 的端點；並以 evidence 保存（service.py:438）
  - id: a-target-creds
    name: 目標認證（auth_profiles 引用的 VIBEAUDIT_* 環境變數）
    sensitivity: secret
    store: 只在 host 上黑箱任務的 supervisor 環境（worker_runtime.py:72-95、394-403）；白箱任務的 supervisor 不帶，也不進任何容器
  - id: a-model-keys
    name: 模型 API 金鑰（model profile 引用的 VIBEAUDIT_* 環境變數）
    sensitivity: secret
    store: controller 程序環境（providers.py:151-153）
  - id: a-db
    name: VIBEAUDIT_DATABASE_URL 與 job／lease 帳本、LangGraph checkpoint
    sensitivity: secret
    store: PostgreSQL（deploy/postgres.compose.yml 綁 127.0.0.1:5432，密碼須由 VIBEAUDIT_POSTGRES_PASSWORD 提供）
  - id: a-session
    name: 啟動權杖、session cookie 與 CSRF token
    sensitivity: secret
    store: 終端機輸出或 VIBEAUDIT_SESSION_TOKEN；瀏覽器 HttpOnly cookie 與工作台分頁的 sessionStorage
  - id: a-evidence
    name: 證據、發現、威脅模型與報告匯出（JSON／Markdown／SARIF）
    sensitivity: confidential
    store: PostgreSQL + data_dir；SHA-256 存於同一資料庫（store.py:166-182），非防竄改
  - id: a-config
    name: 執行設定（runtime.json、manifest 的 allowed_requests／allowed_target_ips／allowed_model_origins、image ID）
    sensitivity: internal
    store: VIBEAUDIT_RUNTIME_CONFIG 與 run manifest（PostgreSQL）
  - id: a-docker
    name: Docker daemon 存取（等同 host root）
    sensitivity: secret
    store: 控制帳號與 supervisor（/var/run/docker.sock，worker_entry.py:39-49）

components:
  - { id: c-operator,     name: 操作者瀏覽器（React 工作台）,                                         kind: browser,          zone: z-operator }
  - { id: c-console,      name: FastAPI 控制台 + LangGraph controller（含 LiteLLM 模型閘道）,          kind: api,              zone: z-control }
  - { id: c-db,           name: PostgreSQL（job／lease 帳本、checkpoint、證據）,                        kind: db,               zone: z-control }
  - { id: c-supervisor,   name: 獨立 supervisor／broker（持有目標憑證、IP 釘選、dispatch 帳本、lease）, kind: worker,           zone: z-control }
  - { id: c-collector,    name: effect collector／mock sink（在控制台程序內執行，目標以 bearer capability 送事件；effect_collector.py:188-225）,         kind: worker,           zone: z-control }
  - { id: c-docker,       name: Docker Engine（supervisor 建立與清理 worker；控制台查詢 /info 與映像，worker_runtime.py:254-298）, kind: tool,             zone: z-host }
  - { id: c-wb-worker,    name: whitebox worker（semgrep、gitleaks、OSV；唯讀 /src、UID 65532、network none）, kind: worker,  zone: z-sandbox }
  - { id: c-bb-worker,    name: blackbox worker（ZAP、Schemathesis、Playwright、promptfoo、PyRIT；UID 65533、network none、Unix socket relay）, kind: worker, zone: z-sandbox }
  - { id: c-target,       name: 操作者提供的 staging 目標（target_url + allowed_target_ips）,          kind: external_service, zone: z-target }
  - { id: c-source,       name: 受測儲存庫（VIBEAUDIT_SOURCE_ROOTS 之下）,                              kind: external_service, zone: z-untrusted }
  - { id: c-llm-local,    name: 本機模型端點（local_only 預設：只接受 literal loopback IP）,            kind: llm,              zone: z-local-llm, maestro_layer: 1 }
  - { id: c-llm-cloud,    name: 雲端模型（openai、anthropic、nvidia_nim；需 cloud_allowed 與 allowed_model_origins）, kind: llm, zone: z-vendor, maestro_layer: 1 }
  - { id: c-commander,    name: AI Commander（每個 run 一次規劃呼叫：reviewer 順序與額外 focus 問題）, kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-reviewers,    name: reviewer A／B／C（三模型獨立白箱審查）,                                kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-challenger,   name: challenger（至多一輪質疑）,                                           kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-arch-mapper,  name: architecture_mapper（資產、資料流、信任邊界）,                         kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-threat-modeler, name: threat_modeler（威脅與安全需求）,                                    kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-test-designer, name: test_designer（設計送往目標的黑箱案例）,                              kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-reporter,     name: reporter（只重排發現順序）,                                           kind: agent,            zone: z-agent, maestro_layer: 3 }
  - { id: c-provisioning, name: provisioning 來源（PyPI、npm、OSV archive、映像 registry；只在管理者 provisioning 時）, kind: external_service, zone: z-vendor }
  - { id: c-ci,           name: GitHub Actions ci.yml（push／pull_request、contents read、無 secrets）, kind: ci,              zone: z-github }
  - { id: c-benchmark,    name: benchmark CLI（python -m vibe_audit.benchmark；live 模式以同一個 generate_json 讓三個模型審查資料集並 debate，benchmark.py:247-252、286-366、441-454）, kind: tool, zone: z-control }

flows:
  - { from: c-operator,    to: c-console,     data: [startup_token, session_cookie, csrf_token, manifest, source_path, auth_profile_refs], protocol: http-loopback, authenticated: true,  crosses_boundary: true }
  - { from: c-console,     to: c-operator,    data: [run_status, findings, evidence, exports],                        protocol: http-loopback, authenticated: true,  crosses_boundary: true }
  - { from: c-source,      to: c-console,     data: [repository_files],                                               protocol: file,          authenticated: null,  crosses_boundary: true }
  - { from: c-console,     to: c-wb-worker,   data: [raw_staging_readonly_mount],                                     protocol: bind-mount,    authenticated: null,  crosses_boundary: true }
  - { from: c-wb-worker,   to: c-console,     data: [scanner_rule_file_line_title],                                   protocol: file,          authenticated: null,  crosses_boundary: true }
  - { from: c-console,     to: c-llm-local,   data: [redacted_snapshot, prompts, operator_notes, scanner_findings, model_outputs, provided_case_trace_fields, target_url, selectable_identity_ids],      protocol: http-loopback, authenticated: null,  crosses_boundary: true }
  - { from: c-console,     to: c-llm-cloud,   data: [redacted_snapshot, prompts, operator_notes, scanner_findings, model_outputs, provided_case_trace_fields, target_url, selectable_identity_ids, model_api_key], protocol: https, authenticated: true, crosses_boundary: true }
  - { from: c-benchmark,   to: c-llm-local,   data: [benchmark_dataset_code, tool_context, peer_reviews],                                 protocol: http-loopback, authenticated: null,  crosses_boundary: true }
  - { from: c-benchmark,   to: c-llm-cloud,   data: [benchmark_dataset_code, tool_context, peer_reviews, model_api_key],                  protocol: https,         authenticated: true,  crosses_boundary: true }
  - { from: c-llm-cloud,   to: c-console,     data: [model_json_output],                                              protocol: https,         authenticated: true,  crosses_boundary: true }
  - { from: c-console,     to: c-db,          data: [runs, jobs, leases, checkpoints, evidence],                      protocol: postgresql,    authenticated: true,  crosses_boundary: false }
  - { from: c-console,     to: c-supervisor,  data: [sealed_cases, manifest, database_url],                           protocol: stdin,         authenticated: null,  crosses_boundary: false }
  - { from: c-console,     to: c-docker,      data: [daemon_info_query, image_inspect],                               protocol: unix-socket,   authenticated: null,  crosses_boundary: true }
  - { from: c-supervisor,  to: c-db,          data: [lease_ledger, dispatch_reservations, worker_results_redacted_responses], protocol: postgresql, authenticated: true, crosses_boundary: false }
  - { from: c-supervisor,  to: c-docker,      data: [container_create, container_cleanup],                            protocol: unix-socket,   authenticated: null,  crosses_boundary: true }
  - { from: c-bb-worker,   to: c-supervisor,  data: [relay_requests, broker_token],                                   protocol: unix-socket,   authenticated: true,  crosses_boundary: true }
  - { from: c-supervisor,  to: c-bb-worker,   data: [relayed_target_responses, task_file_spec_http_case_minimized, broker_token],         protocol: unix-socket,   authenticated: true,  crosses_boundary: true }
  - { from: c-bb-worker,   to: c-console,     data: [worker_result_claims, tool_artifacts_base64],                    protocol: stdout,        authenticated: null,  crosses_boundary: true }
  - { from: c-supervisor,  to: c-target,      data: [http_requests, target_credentials],                              protocol: https,         authenticated: true,  crosses_boundary: true }
  - { from: c-target,      to: c-supervisor,  data: [http_responses_max_256kib],                                      protocol: https,         authenticated: true,  crosses_boundary: true }
  - { from: c-target,      to: c-collector,   data: [side_effect_events],                                             protocol: http,          authenticated: true,  crosses_boundary: true }
  - { from: c-collector,   to: c-console,     data: [effect_receipts],                                                protocol: in-process,    authenticated: null,  crosses_boundary: false }
  - { from: c-provisioning, to: c-docker,     data: [images_by_digest, hash_locked_packages, osv_archive],            protocol: https,         authenticated: null,  crosses_boundary: true }

trust_boundaries:
  - { id: tb-browser,   name: 瀏覽器 ↔ 控制台（啟動權杖、CSRF、Host／Origin、Sec-Fetch-Site；api.py:121-218）,               zones: [z-operator, z-control] }
  - { id: tb-input,     name: 受測 repo ↔ 控制平面（repo 內容一律視為不受信任資料）,                                     zones: [z-untrusted, z-control] }
  - { id: tb-agent,     name: 模型輸出 ↔ 控制平面（JSON schema、Pydantic 契約與確定性閘門；模型 prompt 不是安全邊界）,   zones: [z-agent, z-control] }
  - { id: tb-model,     name: 控制平面 ↔ 模型端點（local_only 預設；cloud 需 allowlist、HTTPS、全域 IP；無 OS 層出向限制）, zones: [z-control, z-local-llm, z-vendor] }
  - { id: tb-sandbox,   name: 控制平面 ↔ worker 容器（network none、cap-drop ALL、唯讀、分開的 UID、不掛 docker socket）, zones: [z-control, z-sandbox] }
  - { id: tb-host,      name: 控制平面 ↔ Docker daemon（能操作 daemon 即等同 host root）,                               zones: [z-control, z-host] }
  - { id: tb-target,    name: supervisor ↔ staging 目標（逐請求檢查 method/path、身分、IP 釘選、lease、預算）,           zones: [z-control, z-target] }
  - { id: tb-supply,    name: provisioning 來源 ↔ host（hash 鎖定、image digest；掃描時不拉映像、不安裝套件）,           zones: [z-vendor, z-host] }

agents:
  # 所有模型呼叫都經 providers.generate_json()：不傳 tools，回覆含 tool_calls 即拒絕（providers.py:337-346、460-461），
  # 輸出須過 JSON schema 與 Pydantic（extra=forbid）。所以除了 test_designer，模型的輸出不觸發動作；但會成為下一個模型的輸入
  # （commander → reviewers、reviewers → challenger／threat_modeler／reporter、architecture_mapper → threat_modeler；retest 時上一個 run 的
  # test_designer 案例 → 新 run 的 threat_modeler；test_designer 寫的案例標題成為黑箱發現的標題 → reporter），見 t-agent-trust-propagation。
  # 目標回應從不送回任何模型（service.py:779；observation 不進模型輸入）。
  - id: c-commander
    accesses_private_data: true          # 快照的檔案路徑清單與操作者備註（service.py:532）
    exposed_to_untrusted_content: true   # 路徑來自受測 repo
    can_communicate_externally: false    # 輸出只有 reviewer 順序（必須恰為三位 reviewer，service.py:533-534）與 focus 文字；focus 每項 ≤ 300 字，以獨立、標為不受信任的欄位交給 reviewer（service.py:535-537、551）
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-reviewers
    accesses_private_data: true          # 完整的去識別化快照（service.py:551）
    exposed_to_untrusted_content: true   # 受測 repo 的文字（可夾帶提示注入）
    can_communicate_externally: false    # 無工具；來源引用須與快照相符（contracts.py:234-246）
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-challenger
    accesses_private_data: true          # 快照與匿名化後的發現（service.py:615-616）
    exposed_to_untrusted_content: true
    can_communicate_externally: false    # 只能引用既有發現 ID（service.py:618）
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-arch-mapper
    accesses_private_data: true          # 快照、操作者需求與備註（service.py:622）
    exposed_to_untrusted_content: true
    can_communicate_externally: false
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-threat-modeler
    accesses_private_data: true          # 架構圖（模型輸出）、發現、需求、快照（service.py:635-638）
    exposed_to_untrusted_content: true
    can_communicate_externally: false    # 輸出經 threat_gate（policy.py:61-100）
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-test-designer
    accesses_private_data: true          # 整份威脅模型、target_url、操作者備註（service.py:676）。威脅模型由讀過整份快照的 threat_modeler 寫成：source_refs／control_evidence 是與快照逐字相符的引用（每則至多 2000 字），invariant、impact、assumptions、需求敘述等其他自由文字不經逐字核對（contracts.py:21-24、51-87；service.py:646-647）
    exposed_to_untrusted_content: true   # 間接：威脅模型由讀過受測 repo 的模型產生（repo → reviewers → threat_modeler → test_designer）
    can_communicate_externally: true     # 它設計的案例經 case_gate、authorize 與 supervisor 後真的送到目標（service.py:675-681、policy.py:102-203、worker_entry.py:284-355）
    tools: []                            # 沒有函式工具；「送出」發生在確定性程式依它的輸出派發請求
    high_impact_tools: [sealed_case_http_dispatch]   # 它設計的封存案例由確定性程式派發為送往目標的 HTTP 請求；live 時須經操作者核准（service.py:724-727、policy.py:175-177）
    # 設計上的控制（見 t-indirect-injection、t-model-identity）：method/path（含 query）須完全符合操作者的 allowed_requests；
    # 模型設計的 POST 一律 blocked（fixture profile 除外）；fixture 路徑的模型本文只送往操作者標 model_body 的端點（service.py:758、815-827）；
    # header 名稱只允許 6 個、拼法與順序固定、值限固定詞彙中的單一值（adapters.py:144-171、191-207）；身分限 model_selectable（policy.py:135-139）；
    # 目標 IP 釘選；整組封存案例須經操作者核准才發出第一個請求（service.py:724-727）。
    # 這些是程式碼層控制，VibeSec 目前只能驗證 claude_permission 類證據，所以沒有 mitigation_evidence。
    # 2026-10-06 由 @chinchiang 決定：以上控制視為切斷對外通訊這隻腳。can_communicate_externally 仍標 true，因為請求確實會送出；
    # 切腳靠的是上述程式碼層控制。接受的殘留：fixture profile 的 JSON body 仍由模型決定，以及低頻寬的選擇通道（見 decisions、t-indirect-injection）。
    mitigations: [egress_allowlist, tool_allowlist, human_in_the_loop]
    trifecta_leg_cut: external_comms
  - id: c-reporter
    accesses_private_data: true          # 發現（含檔案、行號與標題，service.py:804）
    exposed_to_untrusted_content: true   # 發現文字源自模型與受測 repo
    can_communicate_externally: false    # 輸出必須恰為發現 ID 的排列（service.py:806-807）
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null
  - id: c-benchmark
    accesses_private_data: true          # --dataset 可指向任何資料集；內建的是本 repo 的合成案例（benchmark.py:441-454）
    exposed_to_untrusted_content: true   # 資料集程式碼與前幾個模型的 peer_reviews（debate，benchmark.py:351-352）
    can_communicate_externally: false    # 同樣只經 generate_json（benchmark.py:295、307、366）：不帶 tools，沿用模型 origin 與金鑰綁定；輸出只寫入本機結果檔
    tools: []
    mitigations: [tool_allowlist]
    trifecta_leg_cut: null

threats:
  - id: t-indirect-injection
    category: MAESTRO-L3
    target: c-test-designer
    description: >-
      受測 repo 的文字（註解、文件）對 reviewer／threat_modeler 注入指令，經威脅模型傳到 test_designer，使它設計的請求把
      快照或操作者備註的內容帶到目標：放在案例或 positive control 的 header 值，或 fixture profile 路徑的 JSON body（至多 64 KiB）。
    mitigation: >-
      模型無工具、輸出須過 schema 與 Pydantic；method/path（含 query）須完全符合 allowed_requests；模型設計的 POST 一律
      blocked（fixture profile 除外）；目標 IP 釘選；目標回應不回饋給模型。模型設計的案例（含其 positive control）header 只允許
      6 個名稱，值只能是固定詞彙中的單一值、不得列多項或帶 q 參數：Accept 18 種（不帶與明列預設的 application/json 在線路上相同）、Accept-Language 26 種、Content-Type 4 種（charset 參數只有
      `; charset=utf-8` 一種寫法）、
      If-Match／If-None-Match 只能是 *（模型看不到目標回應，沒有真的 ETag）、X-Requested-With 只能是 XMLHttpRequest
      （adapters.py:162-171）。header 名稱只有一種拼法（Accept、Accept-Language…），大小寫不同的重複名稱在設計階段即拒絕，
      依名稱排序送出（adapters.py:144-146、174-207、398-400；service.py:680-690）：大小寫、重複與順序都不再是模型的選擇。
      case_gate 先擋（policy.py:132-134）；目標前最後一個受信任的節點 supervisor 依 sealed case 的來源標記，再以模型詞彙重驗
      （worker_entry.py:334-345），不只靠不受信任容器內的檢查。fixture 路徑上，模型撰寫的本文只送往操作者在 allowed_requests
      標 model_body 的端點（service.py:758、815-827；supervisor 再擋一次，worker_entry.py:336-338）。整組封存案例須經操作者
      核准（核准綁定案例雜湊收據），之後才發出第一個請求（service.py:183-197、724-727）；執行 capability 本身也要求這份核准
      （policy.py:175-177），不只靠 black-box 階段的順序。身分只能是 model_selectable 的測試身分
      （見 t-model-identity）。
      殘留：(1) 操作者標 model_body 的端點上，JSON 本文仍由模型決定，操作者在核准前可看到完整本文；(2) 低頻寬的選擇通道：模型
      仍可在允許範圍內選擇 path、身分、各 header 的值與是否帶上、請求的次序與次數；每個請求的 header 組合約 3.5 萬種（約 15 bits），
      整個 run 的總量隨請求數線性增加，上限是操作者設定的 budget.max_requests，操作者核准時看得到案例數與重複次數。
      2026-10-06 第一次 G4 架構審查指出 q 值與多項列表；第二次指出名稱大小寫／重複／順序與 fixture 本文目的地；第三次指出
      Content-Type 的 charset 有三種寫法、明列 Accept 與不帶在線路上可區分（實際約 5.3 萬種）。都已修正；殘留與 @chinchiang
      接受的「每個請求約十餘 bits、請求的次序與次數」一致（見 decisions）。
    status: mitigated
    gate: G6
  - id: t-model-identity
    category: STRIDE-E
    target: c-test-designer
    description: >-
      case.identity 會讓 supervisor 附上對應 auth profile 的憑證（adapters.py:402-426）；若模型可任選已設定的身分，注入或誤判
