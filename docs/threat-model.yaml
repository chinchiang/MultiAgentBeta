      origin，預設不綁定；預檢列出未綁定的變數並拒絕（service.py:382-387），supervisor 環境不帶未綁定的值、只帶綁定設定本身
      （worker_runtime.py:77-95），送出前再以環境的綁定核對一次（adapters.py:78-110、416-418）；該變數也列為保留設定（adapters.py:37）。
      2026-10-06 第 6 次 G4 identity 審查指出原本只綁定模型金鑰，已補上（行為變更，2026-10-06 @chinchiang 確認保留）。
      殘留：持有 session 的人仍可在已綁定的 origin 使用金鑰（耗用額度），也可用已綁定的測試身分對該 origin 送出 allowed_requests 內的請求。
