      固定的權杖要由操作者換值並重啟才會失效；錯誤權杖的延遲不限制並行請求，抗猜測靠權杖本身的熵（自動產生的權杖 256 bits）；
      自訂權杖的強度以字元頻率估算，辨識不出字典詞組成的 passphrase，README 要求以 secrets.token_urlsafe 產生。
