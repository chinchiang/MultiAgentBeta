    gate: null
  - id: t-container-escape
    category: MAESTRO-L4
    target: c-wb-worker
    description: >-
      受測 repo 是惡意輸入，可利用 semgrep、gitleaks、OSV 的解析器漏洞在 whitebox 容器內執行程式並嘗試逃逸；不逃逸也能讀取掛載的
      raw staging（含機密檔），把內容寫進掃描結果，經控制台送進模型輸入與匯出。
    mitigation: >-
      UID 65532、--cap-drop ALL、no-new-privileges、--read-only、network none、pids／記憶體／CPU 限制、不掛 docker socket、
      --pull never（worker_runtime.py:206-234）。白箱任務不啟動 broker、不掛 /broker，其 supervisor 也不帶目標範圍、測試身分與憑證
      （worker_entry.py:521、worker_runtime.py:72-75、220、394-403），解析惡意 repo 的容器沒有可連的 supervisor 請求通道。Docker daemon 沒有套用 seccomp profile（或為 unconfined）時 runtime 拒絕上線，
      並把 AppArmor、userns、rootless 等安全選項記入 run（worker_runtime.py:268-275）。掃描結果只是聲明：標題由 harness 依自己的規則檔
      或固定文字產生，不採用容器回傳的訊息。rule ID 只接受 harness 列得出來的名稱：semgrep 是 harness 規則集內的規則，gitleaks 是
      釘選映像 8.30.1 的 222 條預設規則（fixtures/gitleaks-default-rule-ids.txt，納入 tool manifest 雜湊），OSV 是已驗證雜湊的離線
      資料庫 all.zip 內的紀錄 ID；其他一律記為 unrecognized-rule 並列為缺口（sandbox.py:82-137、197-199；worker_runtime.py:543-544；
      resource_manifest.py:19）。發現先去重並依檔案、行號、規則排序，順序與重複不帶資訊（sandbox.py:193-196）。檔案路徑須在
      staging 清單內並經遮罩，行號不得超過 staging 副本中該檔的行數（副本雜湊不符即不採計），否則整筆不匯入並記為缺口，證據也只
      保存收斂後的結果（service.py:480-500；staging.py:138-151；service.py:605-612）。
      殘留：沒有自訂 seccomp 或 AppArmor profile、
      未要求 userns；/tmp tmpfs 可執行；kernel 漏洞仍可逃逸。容器內的程式仍可藉由選擇回報哪些「檔案、行號、已知規則」組合帶出資訊：
      每個 scanner 至多 1000 筆、以集合計，數百個檔案、每檔數百行時約為每次掃描數 KB，足以帶出一份小型 .env。
      2026-10-06 由 @chinchiang 接受此殘留（當時記為「少量資訊」）；同日第 5 次 G4 架構審查指出 gitleaks／OSV rule ID 只檢查格式、
      行號沒有上限，實際可達每個 prompt 數百 KiB，已收斂為上述數 KB 等級，量化後的殘留 2026-10-06 由 @chinchiang 確認接受。可再收斂的作法：
      只讓 gitleaks 看到機密檔，semgrep 與 OSV 改掛不含機密檔的副本。日後若改用 gVisor／userns-remap，須在真 Docker 上重驗。
    status: accepted
    gate: G3
  - id: t-target-response-parsing
    category: MAESTRO-L4
    target: c-bb-worker
    description: >-
      受測 repo 的作者也可能掌控目標：目標回應經 supervisor 原樣交回黑箱容器（worker_entry.py:488-490），由 ZAP、Schemathesis、
      Playwright、promptfoo、PyRIT 解析（tool_runners.py:150-221），可能利用解析器漏洞在容器內執行程式；容器的結果與 base64
      artifact 再回到控制台被解碼解析，含 XML（worker_runtime.py:497-505、tool_runners.py:224-283）。
    mitigation: >-
      黑箱容器沿用 whitebox 的隔離設定，並只能經 broker 與 supervisor 通訊（見 t-container-escape、t-broker-token）。容器結果只是聲明：
      控制台只採信 supervisor 自己記錄的欄位（SUPERVISED_FIELDS，worker_runtime.py:121-125）；工具 XML 先以 expat 掃描，
      任何編碼下有 DTD 或 entity 宣告即拒絕（tool_runners.py:31-46、257-259）。http_case 由 supervisor 固定請求序列：依序送各 positive control，再送案例本身，每個 task 一次；
      control 未達成就停止，順序與次數都不是容器的選擇（worker_entry.py:244-254、297-303、474-480）。http_case 的容器只拿到送出與
      判定所需的欄位（method、path、headers、body、identity、oracle、control 的 required_text），不含標題、威脅與需求 ID，control
      名稱改為 control-N；fixture 路徑的 request_sequence 由 supervisor 與控制台判定，容器只拿案例 ID 與各 step 的請求（method、path、
      headers、identity、body），標籤改為 step-N，不含 oracle，也不含 step 的預期狀態與 required_text；supervisor 在未達成的 step
      停止並以 502 拒絕下一個請求，控制台再依 supervisor 的紀錄逐步重驗，容器自報的 completed 不能讓失敗的 reset／cleanup 過關
      （worker_entry.py:139-142、256-282、523、704；worker_runtime.py:169-203）。tool 任務只跑操作者自填的案例，照原樣交給容器。
      模型寫的 forbidden_text 與 required_text 每項至多 120 字（contracts.py:154）。
      殘留：(1) 容器逃逸同 t-container-escape（已接受）。(2) 若目標回應攻陷了 http_case 的容器，容器內的程式仍知道模型寫的 oracle 與
      control 文字（每個案例至多約 26 KB）；fixture 路徑的容器只知道會送出的 step 請求（本文即送往 model_body 端點的內容）。兩者都可藉
      送出時間與提早停止調變給目標；請求內容、順序與次數都已由 supervisor 固定。這是 c-test-designer
      切腳論證的前提，2026-10-06 第 6 次 G4 架構審查後補記於 decisions；殘留 (2) 同日由 @chinchiang 確認接受。
    status: mitigated
    gate: G4
  - id: t-route-authz-layer
    category: STRIDE-E
    target: c-console
    description: >-
      授權原本只在單一 HTTP middleware 以路徑前綴判斷（api.py:121-151）；handler 與 workspace_router 沒有第二道檢查，新增路由或
      把 router 掛到沒有這個 middleware 的 app 時會 fail-open。
    mitigation: >-
      所有 /api 路由（/api/session 除外）與 workspace_router 都另外依賴 require_session，自行驗證 session cookie 與 CSRF token
