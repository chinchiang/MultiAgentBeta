      記錄做出決策的 session 指紋（api.py:162、workspace_api.py:141、150）。
    status: mitigated
    gate: G4
  - id: t-source-root-escape
    category: STRIDE-I
    target: a-target-source
    description: >-
      live run 的來源目錄須在 VIBEAUDIT_SOURCE_ROOTS 之下，檢查用的是 resolve() 之後的路徑，但 run 原本存的是未正規化的原始字串。
      含 ".." 且前面經過 symlink 的路徑，建立時落在根目錄內；之後把那個 symlink 換成實體目錄，preflight 照字面讀到的就是根目錄外的
      目錄，內容進入快照證據與模型輸入。
    mitigation: >-
      建立 run 與 retest 時改存 resolve() 之後、通過根目錄檢查的那個路徑（api.py:282-288、workspace_api.py:96-100）；staging 拒絕
      含 ".." 的路徑，並逐層拒絕 symlink 祖先，讀檔時每一層以 O_NOFOLLOW 開啟（staging.py:34-43、18-31）。2026-10-06 第 6 次
      G4 identity 審查指出，已修正。殘留：根目錄本身與其下的內容由操作者與主機管理者負責；持有 session 的人可選根目錄下的任何目錄。
    status: mitigated
    gate: G4
  - id: t-agent-trust-propagation
    category: MAESTRO-L3
    target: c-reviewers
    description: >-
      模型的輸出會成為下一個模型的輸入：commander 讀過受測 repo 的檔名後寫的 focus 送給三位 reviewer（common-mode），reviewer 的
      發現送給 challenger、threat_modeler 與 reporter，architecture_mapper 的架構圖送給 threat_modeler。受測 repo 若能左右上游模型，
      就能把文字從資料通道帶進下游模型的指示，影響審查與威脅模型的完整性（漏報、威脅模型偏斜）。retest 也是一條跨 run 的鏈：上一個 run
      由 test_designer 設計的案例原樣複製進新 run 的 manifest（workspace_api.py:92-94），新 run 的 threat_modeler 以 provided_cases 讀到。
      test_designer 寫的案例標題也成為黑箱發現的標題（service.py:779），送進 reporter（service.py:804）。benchmark CLI 的 debate
      把前幾個模型的審查交給下一個模型（benchmark.py:351-352）。
    mitigation: >-
      核心審查問題由 harness 持有，commander 不能刪減；commander 的 focus 每項最多 300 字，放在獨立欄位並標為不受信任的模型衍生
      資料交給 reviewer（contracts.py:225-228、service.py:535-537、551）。所有模型的系統提示都把受測 repo、工具內容與其他 agent 的
      輸出標為資料、不是指示（service.py:25、providers.py:410）。三位 reviewer 須屬不同 family（policy.py:47-59）；這些 agent 沒有
      工具，輸出不觸發動作，所以影響限於審查完整性，不打開對外通訊（見 t-indirect-injection）。retest 複製的模型案例保留 designed_by，
      照樣受 case_gate 的詞彙與身分限制，也要操作者重新核准才送出。threat_modeler 的 provided_cases 只帶追溯所需的欄位
      （id、標題、威脅與需求 ID、adapter、method、path、身分），不帶 header 值與本文，操作者寫進案例的測試帳密不會送到模型
      （service.py:636-637）。reporter 的輸出只能是發現 ID 的排列（service.py:806-807），影響限於報告順序；benchmark 的模型沒有
      對外動作，輸出只寫入本機結果檔。殘留：標記是提示層級，不是硬邊界；
      common-mode 影響仍可能讓三位 reviewer 同時漏報，靠 challenger、靜態掃描器與人工審查補足。
    status: mitigated
    gate: G6
  - id: t-docker-root
    category: STRIDE-E
    target: c-docker
    description: supervisor 與控制帳號能操作 Docker daemon，等同 host root；控制平面被入侵即主機淪陷。
    mitigation: 專用控制帳號；worker 不掛 docker socket；README 將容器、資料庫與控制程序的管理者列為受信任邊界。
    status: accepted
    gate: null
  - id: t-broker-token
    category: STRIDE-S
    target: c-bb-worker
    description: >-
      broker socket 為 0666，broker token 放在工具可讀的 0444 task 檔（worker_entry.py:410-523），容器內任何程序都能向
      supervisor 送請求。
    mitigation: supervisor 對每個請求比對 sealed case 的 method、path、header、body 與身分，並檢查 lease 與預算；token 不是防線。
    status: mitigated
    gate: G4
  - id: t-outcome-unknown
    category: STRIDE-T
    target: c-target
    description: 改變狀態的請求在中斷時結果未知，自動重送可能重複副作用。
    mitigation: I/O 前先記為 sent；中斷即 outcome_unknown，resume 拒絕；需 reconciliation／reset，不自動重播（docs/ARCHITECTURE.md）。
    status: mitigated
    gate: G5
  - id: t-evidence-forgery
    category: STRIDE-R
    target: a-evidence
    description: 目標回應的文字偽造受信任來源或 collector 綁定；或有資料庫權限者竄改證據。
    mitigation: >-
      collector 綁定需操作者另外註冊，目標文字無法註冊或偽造來源（docs/ARCHITECTURE.md）；匯出前驗證證據雜湊。
      殘留：雜湊與證據存在同一資料庫（store.py:166-182），不是防竄改。
    status: accepted
    gate: G5
  - id: t-sarif-injection
    category: STRIDE-T
    target: a-evidence
    description: >-
      發現標題可能源自模型或掃描器輸出；SARIF 檢視器會把純文字裡的 [文字](目標) 呈現為連結，控制字元與 bidi 標記可隱藏或重排
      文字，下游若以 Markdown／HTML 呈現還可能被注入內容。
    mitigation: >-
      SARIF 的 message.text、logicalLocation 名稱與 suppression 理由都經 sarif_text（service.py:862-872）：依 SARIF 2.1.0 §3.11.6
      以反斜線跳脫方括號、移除控制字元與 bidi／零寬字元、上限 1000 字。Markdown 匯出有跳脫（service.py:830-855）；React 工作台
      以 <pre> 呈現 JSON，沒有 dangerouslySetInnerHTML。殘留：不合規的檢視器若把純文字當 HTML 渲染，< > 仍原樣保留。
    status: mitigated
    gate: G3
  - id: t-supply-chain
    category: MAESTRO-L7
    target: c-provisioning
    description: 掃描器與工具映像、Python／npm 相依在 provisioning 時被竄改。
    mitigation: >-
      根目錄 requirements.lock.txt 以 --require-hashes 安裝；runtime 只接受 sha256 image ID；工具映像 FROM 釘 digest；
      工具映像 npm ci --ignore-scripts；OSV 離線 archive 有雜湊；掃描時不拉映像、不安裝套件。殘留：
      deploy/worker/locks/python-requirements.txt 沒有 hash；apt-get 未釘版（docs/VALIDATION.md）；deploy/worker/Dockerfile
      的 BASE_IMAGE 由操作者提供。補 hash 會改動已驗收的 Dockerfile.tools.locked，須在有 Docker 的環境重建工具映像並重跑工具
      契約（docs/image-validation.json）後才能宣告，本次未改。2026-10-06 由 @chinchiang 接受此殘留。
    status: accepted
    gate: G1
  - id: t-raw-staging-retention
    category: STRIDE-I
    target: a-target-source
    description: raw staging 副本保留受測 repo 的機密檔；程序被強制終止後到下次啟動之間仍留在磁碟。
    mitigation: >-
      whitebox 結束、每次 attempt 結束（finally）與啟動時都會刪除（service.py:67-92、235-277）；父目錄 0700；resume 須與凍結摘要相符。
      data_dir 與 artifacts 目錄設為 0700、evidence 檔 0600；POSIX 上無法設成只有擁有者可存取時拒絕啟動（store.py:30-45、55-58、171）。
      殘留：只在 POSIX 強制；Windows 只支援 demo（live 需要 Linux Docker runtime），資料為合成資料，目錄權限依上層目錄的 ACL 繼承。
    status: mitigated
    gate: G2
  - id: t-controller-egress
    category: STRIDE-I
    target: c-console
    description: controller 沒有 OS 層出向限制；模型端點的 origin 釘選是應用層邊界（providers.py:4-5）。
    mitigation: 預設 local_only；文件要求以 OS／網路層另行隔離（README）。
    status: accepted
    gate: null
  - id: t-denial-of-wallet
    category: MAESTRO-L5
    target: c-console
    description: 模型呼叫次數或 token 用量失控。
    mitigation: 每個 run 與 probe 都有明確預算（max_model_calls、max_tokens、max_seconds；api.py:381-389、policy.authorize）。
    status: mitigated
    gate: null
  - id: t-ci-fork
    category: STRIDE-E
    target: c-ci
    description: fork PR 在 CI 執行不受信任的程式碼並取得寫入權或 secrets。
    mitigation: >-
      只用 push／pull_request（無 pull_request_target）；contents: read；不用 secrets；actions 釘 SHA 且 persist-credentials: false；
      Postgres 服務釘 digest；pip --require-hashes。殘留：frontend 的 npm ci 未加 --ignore-scripts（runner 內沒有 secrets）。
    status: mitigated
    gate: G3

risk_tier: L3
risk_tier_rationale: >-
  docs/01 §4 決策樹推導為 L2：exposure internal（只監聽 127.0.0.1、單一使用者），data_sensitivity
  sensitive_pii_or_secrets，沒有同時對外暴露又有高影響工具的 agent。草稿依 docs/01「建議 L3 若 sensitive_pii_or_secrets」
  提為 L3：本工具持有受測專案的目標憑證與原始碼（含機密檔），操作 Docker daemon（等同 host root），且模型輸出會驅動送往
  外部系統的請求。2026-10-06 由 @chinchiang 決定維持 L3。

decisions:
  - >-
    控制台只供本機單一使用者，不提供多人或遠端存取（README「安全政策」）。這是授權不變量：run、證據與設定都沒有 owner 欄位，
    以 run_id 查詢即可存取；若日後改為多人使用，必須先加上 owner 綁定，否則每個 run_id 端點都是 BOLA。
  - 預設 local_only；雲端模型須由操作者逐 run 明確允許並列出 origin。
  - 主機管理者、Docker daemon、資料庫與控制程序屬受信任邊界。
  - 不自動重播 outcome_unknown 的請求；需人工 reconciliation／reset。
  - 模型設計的 state-changing 案例一律 blocked，除非有註冊的 reset／cleanup fixture protocol。
  - 模型設計的案例只能使用操作者標記 model_selectable 的測試身分，header 值限固定詞彙（2026-10-06，@chinchiang 確認保留此行為變更）。
  - >-
    模型金鑰只送到操作者以 VIBEAUDIT_MODEL_CREDENTIAL_ORIGINS 綁定的 origin，loopback 也不例外；請求本文無法改變金鑰的去向
    （2026-10-06，@chinchiang 確認保留此行為變更）。
  - 證據雜湊用於一致性檢查，不宣稱法證級不可竄改。
  - >-
    live run 中有模型設計的案例時，black-box 階段開始前暫停於 awaiting_approval，操作者核准綁定封存案例雜湊的收據後才送出；
    操作者自填的案例不需核准（2026-10-06 第二次 G4 審查後新增；@chinchiang 授權代理決定）。
  - >-
    接受三條威脅的殘留（2026-10-06，@chinchiang 決定）：t-redaction-gap（快照遮罩是啟發式，無前綴的高熵 token 無法可靠辨識）、
    t-container-escape（已要求 seccomp，但沒有自訂 seccomp／AppArmor profile 或 userns，kernel 漏洞仍可逃逸；掃描結果的選擇通道
    在第 5 次 G4 審查後量化為每次掃描數 KB，@chinchiang 確認接受）、
    t-supply-chain（工具映像的 Python lock 沒有 hash、apt-get 未釘版、Dockerfile 的 BASE_IMAGE 由操作者提供）。
  - >-
    c-test-designer 的致命三要素以 external_comms 切腳（2026-10-06，@chinchiang 決定）。理由：模型設計的請求只能送往操作者
    明列的 origin 與 IP，method/path（含 query）須完全符合 allowed_requests；POST 除 fixture profile 外一律 blocked；header 值限
    固定詞彙中的單一值、身分限 model_selectable；目標回應不回饋給任何模型。接受的殘留：(1) fixture profile 路徑（例如 ai_http
    的 prompt）的 JSON body 仍由模型決定，只送往操作者宣告的 fixture 目標；(2) 低頻寬的選擇通道：模型在允許範圍內選擇 path、
    身分、header 值與是否帶上、請求的次序與次數，每個請求的 header 約十餘 bits（同日 G4 架構審查後補記，@chinchiang 接受）。
    同日第二次 G4 架構審查指出兩個前提與程式不符：header 名稱的大小寫、重複與順序仍由模型決定（每個請求可達數百 bits），
    fixture 本文可送往任何允許的 POST。已修正為：名稱拼法與順序固定、重複即拒絕，supervisor 再以模型詞彙重驗；模型本文只送往
    操作者標 model_body 的端點；整組封存案例經操作者核准才送出（執行 capability 也要求核准）。第三次審查再指出 Content-Type 的
    charset 寫法與 Accept 是否明列兩個多餘選擇，也已收斂。修正後殘留（每個請求約 15 bits，總量受 budget.max_requests 限制；
    本文只到 model_body 端點）與上述決定的範圍一致，決定維持。第六次審查指出這個論證隱含「黑箱容器未被攻陷」的前提：容器拿到
    整個案例，且 http_case 的請求順序與次數原由容器決定。已改為 supervisor 固定序列與次數、容器只拿送出與判定所需的欄位、
    oracle 文字每項至多 120 字。明列前提：若目標回應攻陷了黑箱容器，容器內的程式仍可用送出時間與提早停止，把模型寫的 oracle
    與 control 文字調變給目標（見 t-target-response-parsing）；此殘留 2026-10-06 由 @chinchiang 確認接受。第七、八次審查補充：殘留 (1) 的 fixture
    本文可攜帶威脅模型中的快照內容（逐字引用，以及 threat_modeler 寫進其他自由文字欄位的內容，含 t-redaction-gap 遮罩漏掉的部分），
    規模只受威脅模型各欄位上限與模型輸出預算限制；操作者核准前看得到完整本文。
  - >-
    測試身分的憑證只送往操作者以 VIBEAUDIT_TARGET_CREDENTIAL_ORIGINS 綁定的 origin，預設不綁定；live run 用到未綁定的測試身分時
    預檢即拒絕（2026-10-06 第 6 次 G4 identity 審查後新增；@chinchiang 確認保留此行為變更）。
  - 本模型為 AI 草稿（2026-10-06，依 commit f9d9cf1 起草、同日依本分支修正更新），待 AppSec 與 Red Team 簽核（docs/01「驗證方式」第 4 項）。
