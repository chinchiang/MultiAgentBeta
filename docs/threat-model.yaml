  - id: t-session-cookie-port
    category: STRIDE-S
    target: c-console
    description: cookie 不依 port 隔離，操作者在同一瀏覽器開的 staging 服務會收到 session cookie（docs/ARCHITECTURE.md）。
    mitigation: >-
      每個 /api 請求（含讀取）都須帶 CSRF token；CSRF token 只在工作台分頁的 sessionStorage，/api/session 不回給只有 cookie
      的呼叫者（api.py:144-199）；Sec-Fetch-Site 為 cross-site／same-site 一律拒絕。設定了 VIBEAUDIT_UI_ORIGINS 時（啟動器會加入實際監聽的埠），:8000 的預設 origin 不再被信任（api.py:74-82）。
