  - id: t-probe-key-exfil
    category: STRIDE-I
    target: c-console
    description: >-
      POST /api/models/probe 與建立 run 都由請求本文決定模型端點與 allowed_model_origins（api.py:390）；若金鑰跟著端點走，
      持有 session 的人可把任一 VIBEAUDIT_* 金鑰送到自己的主機，或本機其他使用者監聽的 loopback 埠。
    mitigation: >-
      只監聽 127.0.0.1；啟動權杖、CSRF、Host／Origin、Sec-Fetch-Site 檢查；CSP script-src 'self'；憑證引用拒絕工具自身設定。
