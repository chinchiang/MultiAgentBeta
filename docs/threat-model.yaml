  - id: t-token-in-logs
    category: STRIDE-I
    target: a-session
    description: 啟動權杖印在 stdout（__main__.py:26-27），由服務管理器或 scripts/verify-linux.sh 擷取 stdout 時會留在日誌。
    mitigation: >-
      只監聽 loopback；前端以 history.replaceState 移除網址列的 token。同時最多 8 個 session（滿了淘汰最久未用者）、閒置 1 小時或
      滿 8 小時失效、可登出本 session 或全部 session，事件串流在 session 結束後停止（api.py:33-34、107-119、210-242、329-332）。
