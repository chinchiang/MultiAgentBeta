# Checks that need no model credentials, Docker images or a target. The Docker integrations stay
# skipped here and run in integration.yml; docs/VALIDATION.md records where they were last run.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the validated release runtime; 3.13 shows what the next interpreter would break.
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        # postgres:18.6, digest read from the registry on 2026-10-03; verified on Docker Hub on 2026-10-31.
        # Use the official source with the same digest; ECR Public anonymous transfer quota blocked CI.
        image: docker.io/library/postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: vibeaudit_test
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vibeaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibeaudit_test -d vibeaudit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      VIBEAUDIT_TEST_POSTGRES: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Node 24 runs the TypeScript Web fixture with built-in type stripping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      # Unused names and imports, syntax errors and the bugbear mistakes (rules in pyproject.toml).
      - run: python -m ruff check backend tests scripts
      # What the backend's annotations say must hold (settings in pyproject.toml).
      - run: python -m mypy
      - run: VIBEAUDIT_TEST_NODE="$(command -v node)" python -m pytest tests -q -rs
      # The console's SSR/API contract smoke against a real backend on loopback, as scripts/verify-linux.sh runs it.
      - run: npm ci
        working-directory: frontend
      - run: VIBEAUDIT_PYTHON="$(command -v python)" sh scripts/contract-smoke.sh

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      # Mistakes, not style: the recommended JS/TS rules and React's rules of hooks.
      - run: npm run lint
        working-directory: frontend
      # Unit and component tests in a simulated browser (vitest + happy-dom); the contract smoke in the backend job covers the real one.
      - run: npm test
        working-directory: frontend
      # Every visible Chinese string in the console needs its English counterpart.
      - run: npm run check:i18n
        working-directory: frontend
      # The console reads engine messages in Chinese with the backend's own table, the same way.
      - run: npm run check:messages
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The committed bundle must be exactly what the committed sources build.
      - run: git add -N frontend/dist && git diff --exit-code -- frontend/dist
      - run: python scripts/package-release.py --check

  windows:
    # Windows is a documented platform for the console and the demo; Docker, PostgreSQL and POSIX-only tests skip there.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pytest tests -q -rs
        env:
          PYTHONPATH: backend
