# Checks that need no model credentials or a target. The scheduled and manual Docker job builds the
# minimal worker image and runs the isolation tests against it; the tool and scanner images stay
# operator-provisioned, and docs/VALIDATION.md records where those were last run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a dependency advisory or a Docker Engine change shows up without a code change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # postgres:18.6, digest read from the registry on 2026-10-03.
        image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: vibeaudit_test
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vibeaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibeaudit_test -d vibeaudit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      VIBEAUDIT_TEST_POSTGRES: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Node 24 runs the TypeScript Web fixture with built-in type stripping, and the SSR/API smoke below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: VIBEAUDIT_TEST_NODE="$(command -v node)" python -m pytest tests -q -rs
      - run: npm ci
        working-directory: frontend
      # The React console rendered against a real loopback backend; not a browser test.
      - name: SSR/API contract smoke
        run: |
          token="$(python -c 'import secrets;print(secrets.token_hex(32))')"
          VIBEAUDIT_SESSION_TOKEN="$token" python -m vibe_audit --port 8002 >"$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 40); do
            python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(s.connect_ex(("127.0.0.1",8002)))' && break
            sleep 0.5
          done
          VIBEAUDIT_SESSION_TOKEN="$token" node frontend/scripts/contract-smoke.mjs --base-url http://127.0.0.1:8002 \
            || { cat "$RUNNER_TEMP/backend.log"; exit 1; }

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The committed bundle must be exactly what the committed sources build.
      - run: git add -N frontend/dist && git diff --exit-code -- frontend/dist
      - run: python scripts/package-release.py --check

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pinned osv-scanner image the white-box scanner uses, here querying osv.dev online.
      - name: Console and backend lockfiles
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner@sha256:4d3d1a42ba435ac706286fec518c044f049c9753d21260b5bae60bab8740ed97
          scan source -L /src/requirements.lock.txt -L /src/frontend/package-lock.json
      # The tool image's closure has advisories without a fix in the pinned promptfoo release; they are
      # reported here and tracked in docs/VALIDATION.md until that image is rebuilt and re-validated.
      - name: Worker tool image lockfiles (report only)
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner@sha256:4d3d1a42ba435ac706286fec518c044f049c9753d21260b5bae60bab8740ed97
          scan source -L /src/deploy/worker/locks/package-lock.json
          -L requirements.txt:/src/deploy/worker/locks/python-requirements.txt

  docker-isolation:
    # Builds take minutes and pull base images, so this runs weekly and on demand rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: vibeaudit_test
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vibeaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibeaudit_test -d vibeaudit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      VIBEAUDIT_TEST_POSTGRES: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      # The python base already pinned for the OSV scanner image (deploy/scanners/Dockerfile.osv).
      - run: >-
          docker build
          --build-arg BASE_IMAGE=python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          -t vibeaudit-worker:test -f deploy/worker/Dockerfile deploy/worker
      - name: Isolated worker, supervisor and fixture protocol on real Docker
        run: |
          image="$(docker image inspect --format '{{.Id}}' vibeaudit-worker:test)"
          VIBEAUDIT_TEST_WORKER_IMAGE="$image" VIBEAUDIT_FIXTURE_IMAGE="$image" VIBEAUDIT_TEST_NODE="$(command -v node)" \
            python -m pytest tests/test_worker_runtime.py tests/test_fixture_protocol.py tests/test_fixtures.py tests/test_packaging.py -q -rs
