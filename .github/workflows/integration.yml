# The Docker integrations that ci.yml leaves skipped: isolated worker, offline scanners, black-box tools and
# fixtures, and the full local pipeline, on images built from deploy/ the way docs/LINUX_SETUP.md section 3
# provisions them. No model credentials or external targets are used. docs/DOCKER_INTEGRATION_TESTING.md
# describes the same run on a workstation.
name: integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      VIBEAUDIT_TEST_POSTGRES: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      VIBEAUDIT_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
      # A worker's broker socket path must fit Linux's 107-byte limit, so work_root stays short.
      WORK_ROOT: /tmp/va-workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Node 24 runs the TypeScript Web fixture with built-in type stripping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      # The supervisor calls the Docker Engine API at the fixed version v1.52 (docs/LINUX_SETUP.md), which the
      # runner's preinstalled Docker may predate. Upgrading restarts the daemon, so PostgreSQL starts afterwards.
      - name: Docker Engine API 1.52 or newer
        run: |
          api="$(docker version --format '{{.Server.APIVersion}}')"
          echo "Docker Engine API $api"
          if [ "$(printf '%s\n' 1.52 "$api" | sort -V | head -n1)" != 1.52 ]; then
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
            sudo systemctl restart docker
          fi
          docker version
      - name: PostgreSQL 18.6 (the same digest as ci.yml)
        run: |
          docker run -d --name va-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_USER=vibeaudit_test -e POSTGRES_PASSWORD=ci-only-throwaway -e POSTGRES_DB=vibeaudit_test postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          for _ in $(seq 60); do docker exec va-postgres pg_isready -U vibeaudit_test -d vibeaudit_test -h 127.0.0.1 && exit 0; sleep 2; done
          docker logs va-postgres; exit 1
      - name: Build and pull the worker, scanner and tool images (docs/LINUX_SETUP.md section 3)
        run: |
          docker build --build-arg BASE_IMAGE=python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 -t vibeaudit-worker:test deploy/worker
          docker build -f deploy/scanners/Dockerfile.gitleaks -t vibeaudit-gitleaks:8.30.1 deploy/scanners
          docker build -f deploy/scanners/Dockerfile.osv -t vibeaudit-osv:2.3.5 deploy/scanners
          docker build -f deploy/worker/Dockerfile.tools.locked -t vibeaudit-tools:integration deploy/worker
          docker pull semgrep/semgrep:1.153.0
          docker pull ghcr.io/zaproxy/zaproxy:2.17.0
      - name: Provision the offline OSV data and a runtime profile (docs/DOCKER_INTEGRATION_TESTING.md section 2)
        run: |
          python scripts/provision-offline-db.py "$RUNNER_TEMP/va-osv"
          python scripts/provision-runtime.py --output "$RUNNER_TEMP/va-runtime.json" --work-root "$WORK_ROOT" --offline-db "$RUNNER_TEMP/va-osv"
          mkdir -p "$WORK_ROOT"
      - name: Run every test, Docker integrations included
        run: |
          export VIBEAUDIT_TEST_RUNTIME_CONFIG="$RUNNER_TEMP/va-runtime.json"
          export VIBEAUDIT_TEST_WORKER_IMAGE="$(docker image inspect --format '{{.Id}}' vibeaudit-worker:test)"
          export VIBEAUDIT_FIXTURE_IMAGE="$VIBEAUDIT_TEST_WORKER_IMAGE"
          export VIBEAUDIT_INTEGRATION_IMAGE="$(docker image inspect --format '{{.Id}}' vibeaudit-tools:integration)"
          export VIBEAUDIT_ZAP_IMAGE="$(docker image inspect --format '{{.Id}}' ghcr.io/zaproxy/zaproxy:2.17.0)"
          export VIBEAUDIT_TEST_NODE="$(command -v node)"
          python -m pytest tests -q -rs
