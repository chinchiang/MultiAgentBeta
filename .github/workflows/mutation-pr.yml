# Mutation testing of the functions a pull request changes (scripts/mutation-test.py --changed): mutmut mutates
# only the top-level functions and methods the diff against the base branch touched in the modules [tool.mutmut]
# names, and none of them may let more mutants escape than tests/mutation-baseline.json records for it (a new
# function must let none). The full run (mutation.yml) keeps the per-module ceilings.
#
# On by default; set VIBEAUDIT_MUTATION="false" to disable automatic runs.
# (Settings > Secrets and variables > Actions > Variables); a manual dispatch always runs.
name: mutation-pr

on:
  pull_request:
    paths:
      - backend/vibe_audit/policy.py
      - backend/vibe_audit/adapters.py
      - backend/vibe_audit/catalog.py
      - backend/vibe_audit/lease.py
      - backend/vibe_audit/snapshot.py
      - backend/vibe_audit/messages.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    if: github.event_name == 'workflow_dispatch' || vars.VIBEAUDIT_MUTATION != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        # postgres:18.6, digest read from the registry on 2026-10-03.
        image: docker.io/library/postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: vibeaudit_test
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vibeaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibeaudit_test -d vibeaudit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install --require-hashes -r requirements.mutation.lock.txt
      - run: python -m pip check
      - run: python scripts/mutation-test.py --changed "origin/${{ github.base_ref }}"
