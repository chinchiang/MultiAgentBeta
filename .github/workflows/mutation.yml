# Mutation testing of the deterministic gates and parsers (scripts/mutation-test.py): every mutant of the
# modules [tool.mutmut] in pyproject.toml names must be caught by their tests. Runs on changes to those
# modules or their tests, weekly, and on request. No model credentials, Docker images or targets are used.
name: mutation

on:
  pull_request:
    paths:
      - "backend/vibe_audit/policy.py"
      - "backend/vibe_audit/adapters.py"
      - "backend/vibe_audit/catalog.py"
      - "backend/vibe_audit/lease.py"
      - "backend/vibe_audit/snapshot.py"
      - "backend/vibe_audit/messages.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.lock.txt"
      - "requirements.mutation.lock.txt"
      - "scripts/mutation-test.py"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install --require-hashes -r requirements.mutation.lock.txt
      - run: python -m pip check
      - run: python scripts/mutation-test.py
