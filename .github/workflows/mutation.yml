# Mutation testing of the deterministic gates and parsers (scripts/mutation-test.py): no module may let more
# mutants escape its tests than tests/mutation-baseline.json allows. A full run takes hours (every surviving
# mutant runs all the tests that cover its function), so this never runs per pull request; run it locally after
# changing a listed module or its tests. No model credentials, Docker images or targets are used.
#
# On by default; set VIBEAUDIT_MUTATION="false" to disable automatic runs.
# (Settings > Secrets and variables > Actions > Variables); a manual dispatch always runs.
name: mutation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    if: github.event_name == 'workflow_dispatch' || vars.VIBEAUDIT_MUTATION != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    services:
      # The lease tests run on SQLite and on PostgreSQL (its own clock and row locks); same image as ci.yml.
      postgres:
        # postgres:18.6, digest read from the registry on 2026-10-03.
        image: public.ecr.aws/docker/library/postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: vibeaudit_test
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vibeaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibeaudit_test -d vibeaudit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      VIBEAUDIT_TEST_DATABASE_URL: postgresql://vibeaudit_test:ci-only-throwaway@127.0.0.1:5432/vibeaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install --require-hashes -r requirements.mutation.lock.txt
      - run: python -m pip check
      - run: python scripts/mutation-test.py
