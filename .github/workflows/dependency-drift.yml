# Weekly dependency drift report (scripts/dependency-drift.py): how far each pin in requirements.lock.txt,
# requirements.mutation.lock.txt and frontend/package-lock.json lags behind its registry, and which pinned
# versions OSV lists an advisory for. The report lands in the job summary; the job fails only on an advisory.
# Nothing is upgraded here: pins change through scripts/hash-lock.py and npm after a review.
name: dependency-drift

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python scripts/dependency-drift.py | tee -a "$GITHUB_STEP_SUMMARY"
