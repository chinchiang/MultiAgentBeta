[build-system]
# 77 is the first release that reads a PEP 639 license string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-audit"
version = "0.2.1"
description = "Evidence-gated multi-model security testing workbench"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.0", "langgraph==1.2.14", "langgraph-checkpoint-postgres==3.1.2", "psycopg[binary,pool]==3.3.6", "litellm==1.104.2", "jsonschema==4.26.0", "openai==2.54.0", "referencing==0.37.0", "tiktoken==0.14.0", "boto3==1.43.110"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.168.5", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
vibe-audit = "vibe_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
vibe_audit = ["tokenizers/*"]

[tool.ruff]
# Lint only: the sources keep their compact style, so no formatter and no line length. F finds unused names and
# imports, E9 syntax and I/O errors, B the bugbear mistakes. B023 is left out because every closure here runs inside
# the iteration that defines it; B905 because the zipped pairs are built to the same length and a mismatch is a bug
# the tests see, not one to raise at that line.
[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B023", "B905"]

[tool.mypy]
# A typing floor for the backend: what the annotations say must hold; untyped code is not forced to annotate.
files = ["backend/vibe_audit"]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Untyped third-party packages.
module = ["jsonschema", "jsonschema.*", "boto3", "boto3.*", "litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
# Mutation testing of the deterministic gates and parsers (scripts/mutation-test.py, Linux only). The script links
# src -> backend for the run: mutmut maps src/<package>/<module>.py to the <package>.<module> the tests import.
source_paths = ["src/vibe_audit"]
only_mutate = ["src/vibe_audit/policy.py", "src/vibe_audit/adapters.py", "src/vibe_audit/catalog.py", "src/vibe_audit/lease.py", "src/vibe_audit/snapshot.py", "src/vibe_audit/messages.py"]
# The copied tests read these next to the copied package.
also_copy = ["catalogs", "fixtures", "docs"]
# The unit suites that exercise those modules. The end-to-end suites (test_engine.py, test_fixture_protocol.py) cover
# the same functions through whole runs and would make every surviving mutant cost minutes; the documentation,
# packaging and Docker-only suites stay out too. ci.yml still runs them all.
pytest_add_cli_args_test_selection = ["tests/test_audit_repairs.py", "tests/test_adapter_transport.py", "tests/test_adapters.py", "tests/test_catalog.py", "tests/test_contracts_and_workspace.py", "tests/test_error_messages.py", "tests/test_lease.py", "tests/test_policy_gates.py", "tests/test_properties.py", "tests/test_providers.py", "tests/test_release_guards.py", "tests/test_review_followups.py", "tests/test_sandbox.py", "tests/test_snapshot_catalog.py"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
