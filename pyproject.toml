[build-system]
# 77 is the first release that reads a PEP 639 license string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-audit"
version = "0.2.1"
description = "Evidence-gated multi-model security testing workbench"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1", "pydantic==2.13.5", "langgraph==1.2.12", "langgraph-checkpoint-postgres==3.1.2", "psycopg[binary,pool]==3.3.6", "litellm==1.102.1", "jsonschema==4.26.0", "openai==2.54.0", "referencing==0.37.0", "tiktoken==0.14.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
vibe-audit = "vibe_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
vibe_audit = ["tokenizers/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
# Mutation testing of the deterministic gates and parsers (scripts/mutation-test.py, Linux only). The script links
# src -> backend for the run: mutmut maps src/<package>/<module>.py to the <package>.<module> the tests import.
source_paths = ["src/vibe_audit"]
only_mutate = ["src/vibe_audit/policy.py", "src/vibe_audit/adapters.py", "src/vibe_audit/catalog.py", "src/vibe_audit/lease.py", "src/vibe_audit/snapshot.py", "src/vibe_audit/messages.py"]
# The copied tests read these next to the copied package.
also_copy = ["catalogs", "fixtures", "docs"]
# The tests that exercise those modules; the documentation, packaging and Docker-only suites stay out.
pytest_add_cli_args_test_selection = ["tests/test_adapters.py", "tests/test_catalog.py", "tests/test_contracts_and_workspace.py", "tests/test_engine.py", "tests/test_error_messages.py", "tests/test_fixture_protocol.py", "tests/test_lease.py", "tests/test_providers.py", "tests/test_release_guards.py", "tests/test_review_followups.py", "tests/test_sandbox.py"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
